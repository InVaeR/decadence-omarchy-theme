# Decadence - Hyprlock configuration
# Golden accents on dark marble. Part of the Decadence Omarchy theme.

$accent = rgba(d4a843ee)
$accent-bright = rgba(e8c05aee)
$marble = rgba(f5f0ebe8)
$marble-dim = rgba(6b6560cc)
$panel = rgba(0d0d0dd9)
$panel-border = rgba(d4a84340)

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 12
    noise = 0.017
    contrast = 0.85
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.3
}

# To use a theme wallpaper instead of a blurred screenshot,
# replace "path = screenshot" above with:
# path = ~/.config/omarchy/themes/decadence/backgrounds/Decadence_01.png

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    outer_color = $panel-border
    inner_color = $panel
    font_color = $marble
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false
    rounding = -1
    check_color = $accent
    fail_color = rgba(c45c5cee)
    fail_text = <i>$FAIL</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 68
    font_family = monospace
    color = $marble
    shadow_passes = 2
    shadow_size = 6
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = Decadence
    font_size = 15
    font_family = sans
    color = $accent
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="#6b6560">Locked</span>
    font_size = 13
    font_family = sans
    color = $marble-dim
    position = 0, -160
    halign = center
    valign = center
}